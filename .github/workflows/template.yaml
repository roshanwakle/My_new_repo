name: Reusable Salesforce Pipeline

on:
  workflow_call:
    inputs:
      deploy:
        description: Whether to deploy after validation
        required: false
        type: boolean
        default: false
      target_environment:
        description: GitHub Environment name for the Salesforce org
        required: false
        type: string
        default: dev
      test_level:
        description: Salesforce deployment test level
        required: false
        type: string
        default: RunLocalTests
    secrets:
      SFDX_AUTH_URL:
        required: false

jobs:
  validate:
    name: Validate Salesforce changes
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run LWC unit tests
        run: npm run test:unit

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@latest

      - name: Install Code Analyzer
        run: sf plugins install code-analyzer@latest

      - name: Run Salesforce Code Analyzer
        id: code-analyzer
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: --workspace force-app --view detail --output-file sfca_results.html --output-file sfca_results.json
          results-artifact-name: salesforce-code-analyzer-results
          github-token: ${{ github.token }}

      - name: Fail on critical or high violations
        if: |
          steps.code-analyzer.outputs.exit-code > 0 ||
          steps.code-analyzer.outputs.num-sev1-violations > 0 ||
          steps.code-analyzer.outputs.num-sev2-violations > 0
        run: exit 1

  deploy:
    name: Deploy to ${{ inputs.target_environment }}
    if: inputs.deploy
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target_environment }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@latest

      - name: Authenticate to Salesforce
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          test -n "$SFDX_AUTH_URL" || { echo "SFDX_AUTH_URL is missing from this GitHub Environment"; exit 1; }
          auth_file="$RUNNER_TEMP/sfdx-auth-url"
          umask 077
          trap 'rm -f "$auth_file"' EXIT
          printf '%s' "$SFDX_AUTH_URL" > "$auth_file"
          sf org login sfdx-url --sfdx-url-file "$auth_file" --set-default --alias DeployOrg

      - name: Deploy Salesforce source
        run: sf project deploy start --source-dir force-app --target-org DeployOrg --test-level "${{ inputs.test_level }}" --wait 10
