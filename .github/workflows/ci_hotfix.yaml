name: Hotfix Branch Validation

on:
  push:
    branches:
      - 'hotfix/**'
    paths:
      - 'force-app/**'
      - 'manifest/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  validate:
    uses: ./.github/workflows/template.yaml
    with:
      deploy: false
