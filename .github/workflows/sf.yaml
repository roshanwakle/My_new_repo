name: Manual Salesforce Deployment
run-name: Deploy to ${{ inputs.target_environment }}

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Salesforce environment to deploy to
        required: true
        type: choice
        options:
          - dev
          - UAT
          - Production
      test_level:
        description: Apex test level
        required: true
        default: RunLocalTests
        type: choice
        options:
          - RunLocalTests
          - RunAllTestsInOrg

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/template.yaml
    with:
      deploy: true
      target_environment: ${{ inputs.target_environment }}
      test_level: ${{ inputs.test_level }}
    secrets: inherit

        