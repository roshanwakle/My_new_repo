name: "SF Workflow"
run-name: "SF workflow is running pipeline"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
jobs:
   setup-salforce:
        name: "Setup Salesforce CLI"
        runs-on: ubuntu-latest

        steps: 
          - name: "Checkout"
            uses: actions/checkout@v4
            with:
              fetch-depth: 0

          - name: "setup saleforce cli"
            run: npm install --global @salesforce/cli@latest

          - name: "Check Salesforce CLI version"
            run: sfdx --version
          
          - name: "Install salesforce analyser"
            run: |
              sf --help
              sf plugins install code-analyzer

          - name: Authenticate to Salesforce
            env:
              SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
            run: |
              test -n "$SFDX_AUTH_URL" || { echo "SFDX_AUTH_URL secret is missing"; exit 1; }
              auth_file="$RUNNER_TEMP/sfdx-auth-url"
              umask 077
              printf '%s' "$SFDX_AUTH_URL" > "$auth_file"
              sf org login sfdx-url \
                --sfdx-url-file "$auth_file" \
                --set-default --alias MyDefaultOrg
              rm -f "$auth_file"